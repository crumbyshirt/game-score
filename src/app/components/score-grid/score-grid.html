<section class="score-grid" aria-label="Scores grid">
  <!-- Header row: player name plates -->
  <div class="score-grid__header" [class.score-grid__header--scrolled]="isScrolled()">
    <div class="score-grid__corner">Round</div>
    @for (p of players().values(); track p.name) {
      <app-name-plate [name]="p.name" [badge]="playerBadges().get(p.name) ?? ''" class="score-grid__nameplate"></app-name-plate>
    }
  </div>

  <!-- Body: scrollable area with score rows -->
  <div class="score-grid__body">
    @for (r of rounds(); track r) {
      <div class="score-grid__row" role="row">
        <div class="score-grid__row-label">{{ r }}</div>
        @for (p of players().values(); track p.name) {
          <app-grid-box
            [value]="p.score?.get(r) ?? null"
            (score)="scoreUpdate(p, r, $event)"
            class="score-grid__cell"
          ></app-grid-box>
        }
      </div>
    }
  </div>
</section>
