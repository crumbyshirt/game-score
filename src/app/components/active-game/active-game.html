<app-announcement-bubble />
<section aria-labelledby="active-game-heading" class="active-game">
  <div class="game-header" [class.game-header--hidden]="scoreGrid?.isScrolled()">
    <h1 id="active-game-heading">Active Game</h1>
    @if (sessionCode()) {
      <span class="session-code" title="Share this code to let others join">
        Code: <strong>{{ sessionCode() }}</strong>
      </span>
    }
    <nav class="nav-buttons">
      <a class="outline secondary nav-btn" routerLink="/">🏠 Home</a>
      <button class="outline secondary nav-btn" (click)="confirmNewGame()">New Game</button>
    </nav>
  </div>

  <!-- Home button persists in top-right on small screens when header collapses -->
  <a class="home-btn-mobile" routerLink="/" aria-label="Home">🏠</a>

  @if (loading()) {
    <p class="loading-msg" aria-live="polite">Loading session…</p>
  }
  <app-score-grid #scrollArea class="game-scroll-area" />
  <div class="game-footer">
    <button class="add-round-btn" (click)="addRound()">+</button>
    <app-total-score />
  </div>
</section>
