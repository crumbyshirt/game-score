<app-announcement-bubble />
<section aria-labelledby="active-game-heading" class="active-game">
  <div class="game-header" [class.game-header--hidden]="scoreGrid?.isScrolled()">
    <h1 id="active-game-heading">Active Game</h1>
    <button class="outline secondary new-game-btn" (click)="confirmNewGame()">New Game</button>
  </div>
  <app-score-grid #scrollArea class="game-scroll-area" />
  <div class="game-footer">
    <button class="add-round-btn" (click)="addRound()">+</button>
    <app-total-score />
  </div>
</section>
